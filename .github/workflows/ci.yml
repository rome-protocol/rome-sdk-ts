name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly re-check — a public repo never goes unverified

permissions:
  contents: read

# Secret scanning = GitHub-native (always-on + push protection on public repos)
# plus CodeQL — no self-hosted scanner job (gitleaks-action needs a paid org license).

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/lint-public-surface.mjs
